<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6fb8">
  <title>Geladão</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>🧊 Geladão</h1>
    <button id="btn-usuario" class="usuario" onclick="App.trocarUsuario()"></button>
  </header>

  <main id="tela"></main>

  <nav class="abas" id="abas">
    <button data-aba="vender" onclick="App.ir('vender')"><span>🛒</span>Vender</button>
    <button data-aba="estoque" onclick="App.ir('estoque')"><span>📦</span>Estoque</button>
    <button data-aba="entrada" onclick="App.ir('entrada')"><span>📥</span>Entrada</button>
    <button data-aba="relatorios" onclick="App.ir('relatorios')"><span>📊</span>Relatórios</button>
    <button data-aba="mais" onclick="App.ir('mais')"><span>⚙️</span>Mais</button>
  </nav>

  <div id="aviso" class="aviso" hidden></div>
  <dialog id="dialogo"></dialog>

  <script src="app.js"></script>
</body>
</html>
